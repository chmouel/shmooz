[package]
name = "shmooz"
version = "0.1.0"
edition = "2024"
description = "A zoom / magnifier utility for Wayland compositors"
license = "Apache-2.0"
homepage = "https://github.com/chmouel/shmooz"
documentation = "https://docs.rs/shmooz"
repository = "https://github.com/chmouel/shmooz"

[dependencies]
bytemuck = "1.24.0"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
clap = { version = "4.6.1", features = ["derive"] }
memmap2 = "0.9.10"
png = "0.18.0"
rustix = "1.1.4"
tempfile = "3.23.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9.0"
